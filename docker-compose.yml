services:
  tsbot:
    build: .
    restart: unless-stopped
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/data # bot identity, SQLite archive, Whisper models
      - ./plugins:/app/plugins:ro # your own plugins (not part of this repository)
    environment:
      PYTHONPATH: /app/plugins
      # Secrets come from a .env file next to this file (never commit it).
      TS_SERVER_PASSWORD: ${TS_SERVER_PASSWORD:-}
      TS_CHANNEL_PASSWORD: ${TS_CHANNEL_PASSWORD:-}
    deploy:
      resources:
        limits:
          cpus: "3" # leave room for the other services on a small machine
          memory: 2g
