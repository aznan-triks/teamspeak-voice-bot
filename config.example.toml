# Copy this file to config.toml (git ignores config.toml), then edit it.
# Secrets do NOT go here: put them in a .env file (see README):
# TS_SERVER_PASSWORD, TS_CHANNEL_PASSWORD, HF_TOKEN, LLM_API_KEY.

[teamspeak]
address = "192.168.1.10"                 # server address, optionally with :port (default port 9987)
nickname = "Hector (recording)"          # tell people the bot records
channel = ""                             # channel path like "Lobby/Games"; empty = the server's default channel
identity_file = "/data/identity.json"    # created on first start; keep it to keep the bot's TeamSpeak profile
bridge_binary = "ts-bridge"
max_utterance_s = 30                     # long speeches are cut into pieces of this length

[stt]
# NVIDIA Parakeet TDT 0.6B v3: 25 European languages, detected automatically.
min_utterance_ms = 400    # shorter sounds are ignored (coughs, clicks)

[archive]
path = "/data/archive.sqlite3"

[privacy]
# TeamSpeak UIDs of people who do not want to be transcribed: their voice never reaches speech-to-text.
opt_out_uids = []

# Who is speaking. "uid:<UID>" (reliable, one per person) wins over "group:<server group name>".
# Only known people can trigger actions by voice.
[identities]
# "uid:ExampleUid0aBcDeFgHiJkLmNoPqRs=" = "Alice"
# "group:Admin" = "Bob"

[voice]
engine = "phonon"         # "phonon" (best French voice, see README "A better voice"), falls back to "piper" by itself
language = "fr"
phonon_model = "hf://gradium/phonon-40m-fr"
# phonon_voice = "Tiphaine"
piper_voice = "fr_FR-siwis-medium"
piper_dir = "/data/models/piper"
cache_dir = "/data/tts_cache"   # every sentence is generated once, then replayed from here

# What the bot says on its own. Replace a sentence, or give the path of an audio file you recorded.
[voice.phrases]
# degraded = "/data/sounds/degraded.ogg"
# cancelled = "OK, je laisse tomber."

[llm]
enabled = false           # turn on once you have an LLM server (see README "Talk to the bot")
base_url = "http://host.docker.internal:8080/v1"   # llama.cpp's llama-server, or any OpenAI-compatible API
model = "qwen3.5-4b"      # name sent to the server (llama-server ignores it)
timeout_s = 20
json_mode = true          # ask for strict JSON; turn off if your provider refuses response_format
wake_words = ["hector"]   # say it to talk to the bot ("Hector, ..."): tested to survive speech-to-text
confirm_timeout_s = 20    # time to say "oui" or "non" after the bot asks
max_failures = 3          # failures in a row before degraded mode
probe_interval_s = 300    # in degraded mode, check the LLM again this often
prompt_file = "prompts/system_fr.txt"

[plugins]
enabled = []              # e.g. ["tsbot.plugins_examples.scoreboard", "my_plugin"]

# [plugins."tsbot.plugins_examples.scoreboard"]
# players = ["Alice", "Bob"]
# games = ["Fléchettes", "Rocket League"]
