# Copy this file to config.toml (git ignores config.toml), then edit it.
# Secrets do NOT go here: put them in a .env file (see README):
# TS_SERVER_PASSWORD, TS_CHANNEL_PASSWORD, HF_TOKEN, LLM_API_KEY.

[teamspeak]
address = "192.168.1.10"                 # server address, optionally with :port (default port 9987)
nickname = "Hector (recording)"          # tell people the bot records
channel = ""                             # channel path like "Lobby/Games"; empty = the server's default channel
identity_file = "/data/identity.json"    # created on first start; keep it to keep the bot's TeamSpeak profile
bridge_binary = "ts-bridge"
max_utterance_s = 30                     # long speeches are cut into pieces of this length
join_gap_ms = 1000                       # TeamSpeak cuts the voice at short pauses: closer pieces are joined into one sentence

[stt]
# NVIDIA Canary-1B-v2 with the language forced: "euh", "ouais" and laughs stay French.
# "nemo-parakeet-tdt-0.6b-v3" is a bit faster but guesses the language (short sounds often come out as English).
model = "nemo-canary-1b-v2"
language = "fr"
vocabulary = []           # the group's own words (games, tools...): what sounds like one is spelled like it
laughs = true             # add "(rires)" when someone laughs (a 10 MB sound tagger, mispeech/ced-mini, ~20 ms a sentence)
laugh_threshold_pct = 20  # lower = more laughs caught, more false ones
# Better on real voices (calls, English words), but the sound leaves this machine: Google Gemini, key in GEMINI_API_KEY
# or the site. Sounds shorter than gemini_min_ms stay local (on a tiny sound Gemini makes up a name). If Gemini
# fails (quota, network), the local model writes the sentence.
# engine = "gemini"
# gemini_model = "gemini-3.5-flash-lite"   # measured 1.0-1.4 s a sentence
# gemini_min_ms = 900
# When Gemini stops answering (quota, overload), the next one is used, then the local model. Same key if none is given.
# gemini_fallbacks = [{ model = "gemini-3-flash-preview" }, { model = "gemini-flash-lite-latest" }]
# To judge another model on real voices: it transcribes the same sounds in the background and the log shows both texts
# (a local model name, or "gemini").
# compare_model = "onnx-community/whisper-large-v3-turbo"
# compare_threads = 2       # CPU cores it may use
# compare_nice = 15         # lower priority than the bot
min_utterance_ms = 400    # shorter sounds are ignored (coughs, clicks)
noise_phrases = ["merci"] # what the model writes for a short noise: dropped when shorter than noise_max_ms
noise_max_ms = 1500

[archive]
path = "/data/archive.sqlite3"

[privacy]
# TeamSpeak UIDs of people who do not want to be transcribed: their voice never reaches speech-to-text.
opt_out_uids = []

# Who is speaking. "uid:<UID>" (reliable, one per person) wins over "group:<server group name>".
# Only known people can trigger actions by voice.
[identities]
# "uid:ExampleUid0aBcDeFgHiJkLmNoPqRs=" = "Alice"
# "group:Admin" = "Bob"

[voice]
engine = "phonon"         # "phonon" (best French voice, see README "A better voice"), falls back to "piper" by itself
language = "fr"
phonon_model = "hf://gradium/phonon-40m-fr"
phonon_voices_dir = "/data/voices"   # extra voices: <name>.safetensors from huggingface.co/gradium/phonon-voices
# phonon_voice = "lucien"            # a file name from that folder; empty = the model's default (female) voice
piper_voice = "fr_FR-siwis-medium"
piper_dir = "/data/models/piper"
cache_dir = "/data/tts_cache"   # every sentence is generated once, then replayed from here

# What the bot says on its own. Replace a sentence, or give the path of an audio file you recorded.
[voice.phrases]
# degraded = "/data/sounds/degraded.ogg"
# cancelled = "OK, je laisse tomber."

[llm]
enabled = false           # turn on once you have an LLM server (see README "Talk to the bot")
base_url = "http://host.docker.internal:8080/v1"   # llama.cpp's llama-server, or any OpenAI-compatible API
model = "qwen3.5-4b"      # name sent to the server (llama-server ignores it)
timeout_s = 20
json_mode = true          # ask for strict JSON; turn off if your provider refuses response_format
thinking = "auto"         # DeepSeek: "off" answers in ~1 s instead of ~2 s; "auto" sends nothing (other servers)
wake_words = ["hector"]   # say it to talk to the bot ("Hector, ..."): tested to survive speech-to-text
confirm_timeout_s = 20    # time to say "oui" or "non" after the bot asks
max_failures = 3          # failures in a row before degraded mode
warm_up = true            # read the prompt once at start: the first question is answered much faster
follow_up_s = 0           # after the bot answers, people can go on talking to it this long without its name
watch_for_actions = false # without its name, the bot may still speak up to propose an action ("Bob won": a point?).
                          # Every sentence then goes to the LLM: use a fast one (DeepSeek: ~1 s, a few cents a night)
follow_up_min_words = 3   # shorter lines ("Merci.", "Ah.") need the bot's name
# The bot's character, in the language it speaks (French here). It sets the tone, never the rules.
personality = """Tu es le pote un peu chambreur du groupe : drôle, direct, jamais méchant. Tu tutoies tout le monde,
tu parles comme un joueur, tu as des avis tranchés sur les jeux et tu aimes taquiner le dernier du classement.
Quand on te demande un service, tu le rends sans faire d'histoires."""
probe_interval_s = 300    # in degraded mode, check the LLM again this often
prompt_file = "prompts/system_fr.txt"
# Services tried in order when this one stops answering (quota, overload, outage, refused key). A failing one rests
# 60 s (rest_s), twice as long each time in a row. Keys: api_key_env names an environment variable (.env).
# fallbacks = [
#   { base_url = "https://api.deepseek.com", model = "deepseek-flash", api_key_env = "DEEPSEEK_API_KEY" },
#   { base_url = "http://127.0.0.1:8091/v1", model = "qwen3.5-4b", api_key = "", timeout_s = 60 },
# ]

[plugins]
enabled = []              # e.g. ["tsbot.plugins_examples.scoreboard", "my_plugin"]

# [plugins."tsbot.plugins_examples.scoreboard"]
# players = ["Alice", "Bob"]
# games = ["Fléchettes", "Rocket League"]
# path = "/data/scoreboard.json"

[follow]
enabled = false           # go where most known players (see [identities]) are; a second bot joins when they split up
max_bots = 2
move_after_s = 10         # people must stay this long before the bot follows (no hopping when someone passes by)
stop_after_s = 60         # the second bot leaves this long after the players are together again
nickname_2 = "BoToP 2 (enregistrement)"
# identity_file_2 = "data/identity_2.json"   # default: next to [teamspeak] identity_file

[web]
# The management site (python -m tsbot.web): open http://THIS-MACHINE:8095 from your home network.
# People log in with a code the bot sends them in a private TeamSpeak message.
port = 8095
host = "0.0.0.0"                 # "127.0.0.1" to reach it only from this machine
control_port = 8096              # the bot's local control API, used by the site; change it if the port is taken
token_file = "/data/control_token"
settings_file = "/data/settings.json"   # what the site changes, on top of this file
secret_file = "/data/web_secret"
admin_groups = ["Server Admin"]  # TeamSpeak server groups whose members manage the bot from the site
admin_uids = []                  # or single people, by TeamSpeak UID
